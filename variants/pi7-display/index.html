<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1024, height=600, initial-scale=1" />
<title>Jarvis</title>
<style>
  :root {
    --bg: #F2EFE9;
    --ink: #1A1A1A;
    --secondary: #4A4640;
    --accent: #C75A3D;
    --hairline: rgba(26, 26, 26, 0.35);
    --ease: cubic-bezier(.25,.1,.25,1);
  }
  html[data-theme="dark"] {
    --bg: #0A0A0A; --ink: #F5F5F5; --secondary: #8A8378;
    --hairline: rgba(245,245,245,0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; width:100vw; height:100vh; overflow:hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 400; -webkit-font-smoothing: antialiased;
    transition: background 800ms var(--ease), color 800ms var(--ease);
  }
  .face {
    position: absolute; inset: 0; width: 100vw; height: 100vh;
    padding: clamp(32px, 4vh, 48px);
    opacity: 0; pointer-events: none;
    transition: opacity 600ms var(--ease);
  }
  .face.active { opacity: 1; }

  /* shared eyebrow / clock */
  .eyebrow, .index {
    position: absolute; top: clamp(32px, 4vh, 48px);
    font-size: 13px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--secondary);
    font-variant-numeric: tabular-nums;
  }
  .eyebrow { left: clamp(32px, 4vh, 48px); }
  .index   { right: clamp(32px, 4vh, 48px); }

  .meta {
    position: absolute; left: clamp(32px,4vh,48px); right: clamp(32px,4vh,48px);
    bottom: clamp(32px,4vh,48px);
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    align-items: end; gap: clamp(16px,3vw,32px);
    border-top: 1px solid var(--hairline);
    padding-top: clamp(16px,2.4vh,24px);
  }
  .meta .cell { display: flex; flex-direction: column; gap: 6px; }
  .meta .cell.center { align-items: center; text-align: center; }
  .meta .cell.right { align-items: flex-end; text-align: right; }
  .meta .label { font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--secondary); }
  .meta .value { font-size: clamp(20px,2.6vw,28px); font-weight: 300;
    letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .meta .value .u { font-size: 0.55em; color: var(--secondary); margin-left: 0.2em; }

  .stroke { fill: none; stroke: var(--ink); stroke-width: 1.6;
    stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .stroke-secondary { stroke: var(--secondary); }
  .stroke-accent { stroke: var(--accent); opacity: 0.6; }

  /* ============ CONNECTION HAIRLINE ============ */
  .conn-bar {
    position: fixed; left: 0; right: 0; top: 0; height: 1px; z-index: 9999;
    background: transparent; transition: background 400ms var(--ease);
    pointer-events: none;
  }
  .conn-bar.disconnected { background: var(--accent); animation: connpulse 1.6s ease-in-out infinite; }
  @keyframes connpulse { 0%,100% { opacity: 0.35; } 50% { opacity: 0.9; } }

  /* ============ BURN-IN: idle drift + dim ============ */
  body.idle-dim { transition: opacity 4s var(--ease); }
  body.idle-dim .face.active { animation: drift 90s ease-in-out infinite; }
  @keyframes drift {
    0%,100% { transform: translate(0,0); }
    25%     { transform: translate(6px,-4px); }
    50%     { transform: translate(-4px,6px); }
    75%     { transform: translate(-6px,-3px); }
  }
  body.idle-dim #home .time, body.idle-dim #home .date { opacity: 0.7; }

  /* ============ PER-FACE MOOD ============ */
  body.face-listening { background: #0A0A0A; color: #F5F5F5; }
  body.face-listening { --secondary: #5A5A5A; --accent: #C75A3D; --hairline: rgba(245,245,245,0.18); }
  body.face-ack       { background: #0E0E10; color: #F5F5F5; --secondary: #6A6A6A; --hairline: rgba(245,245,245,0.18); }
  body.face-commute   { --accent: #2B6CB0; }
  #grocery .g-row { will-change: transform; touch-action: pan-y; }
  #grocery .g-row.swiping { transition: none !important; }
  #grocery .g-row.dismissing { transition: transform 350ms var(--ease), opacity 350ms var(--ease); }
  /* Paused mode: tap stage to stop the roll and scroll manually */
  #grocery .g-stage.paused { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #grocery .g-stage.paused .g-roll { position: static; top: auto; transform: none !important; animation: none !important; padding: clamp(48px,8vh,80px) 0; }
  #grocery .g-stage.paused .g-fade-top, #grocery .g-stage.paused .g-fade-bot { opacity: 0; }
  #grocery .g-hint { position: absolute; right: clamp(32px,4vh,48px); top: clamp(32px,4vh,48px); font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--secondary); opacity: 0; transition: opacity 300ms var(--ease); pointer-events: none; }
  #grocery .g-stage.paused ~ .g-hint, #grocery:hover .g-hint { opacity: 1; }

  /* ============ GLOBAL NAV STRIP ============ */
  .nav-bar {
    position: fixed; left: 0; right: 0;
    bottom: clamp(12px, 2vh, 18px);
    display: flex; gap: 10px; justify-content: center;
    z-index: 50; pointer-events: none;
    transition: opacity 400ms var(--ease), transform 400ms var(--ease);
  }
  .nav-bar .nav-pill {
    pointer-events: auto;
    background: rgba(242, 239, 233, 0.85); color: var(--secondary);
    border: 1px solid var(--hairline); border-radius: 999px;
    padding: 9px 18px; font-size: 11px; letter-spacing: 0.22em;
    text-transform: uppercase; font-family: inherit; font-weight: 400;
    cursor: pointer; backdrop-filter: blur(6px);
    transition: color 180ms var(--ease), border-color 180ms var(--ease),
                background 180ms var(--ease), transform 120ms var(--ease);
  }
  html[data-theme="dark"] .nav-bar .nav-pill,
  body.face-listening .nav-bar .nav-pill,
  body.face-ack .nav-bar .nav-pill { background: rgba(10,10,10,0.85); }
  .nav-bar .nav-pill:active { transform: scale(0.96); }
  .nav-bar .nav-pill:hover { color: var(--ink); border-color: var(--ink); }
  .nav-bar .nav-pill.active { color: var(--ink); border-color: var(--ink); background: var(--bg); }

  /* Hide nav on transient faces (ack / listening) so they stay full-bleed */
  body.face-listening .nav-bar,
  body.face-ack       .nav-bar { opacity: 0; pointer-events: none; transform: translateY(8px); }

  /* MODE: voice = ambient only. All face touches inert.
     Only the mode-toggle button remains tappable so you can escape voice mode. */
  body[data-mode="voice"] .nav-bar { opacity: 0; pointer-events: none; transform: translateY(8px); }
  body[data-mode="voice"] .face,
  body[data-mode="voice"] .tappable,
  body[data-mode="voice"] #grocery .g-row,
  body[data-mode="voice"] #floorplan .fp-room { pointer-events: none; cursor: default; }
  body[data-mode="voice"] .meta .cell.tappable .value,
  body[data-mode="voice"] #commute .hero.tappable .eta-num { border-bottom: none; }
  /* Mode toggle ALWAYS interactive — it is the escape hatch */
  .mode-toggle { pointer-events: auto !important; }

  /* ============ MODE TOGGLE ============ */
  .mode-toggle {
    position: fixed; top: clamp(10px, 1.6vh, 16px); right: clamp(10px, 1.6vw, 16px);
    z-index: 60; pointer-events: auto;
    background: transparent; border: 1px solid var(--hairline); border-radius: 999px;
    padding: 6px 12px 6px 10px;
    display: flex; align-items: center; gap: 8px;
    color: var(--secondary); font-family: inherit; font-size: 10px;
    letter-spacing: 0.22em; text-transform: uppercase; font-weight: 500;
    cursor: pointer;
    transition: color 180ms var(--ease), border-color 180ms var(--ease);
  }
  .mode-toggle:hover { color: var(--ink); border-color: var(--ink); }
  .mode-toggle .mode-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
  }
  body[data-mode="voice"] .mode-toggle .mode-dot { background: var(--secondary); }
  body[data-mode="touch"] .mode-toggle .mode-dot { background: var(--ink); }


  /* ============ HOME (at-rest) ============ */
  #home .clock-hero {
    position: absolute; left:50%; top:50%; transform: translate(-50%,-50%);
    text-align: center;
  }
  #home .time {
    font-size: clamp(96px, 22vw, 264px); font-weight: 200;
    line-height: 0.92; letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
  }
  #home .date {
    margin-top: clamp(8px,1vh,12px);
    font-size: clamp(14px,1.6vw,18px); letter-spacing: 0.32em;
    text-transform: uppercase; color: var(--secondary);
  }
  /* breathing hairline under the time */
  #home .breath {
    margin: clamp(20px,2.5vh,28px) auto 0; height: 1px; width: 120px;
    background: var(--ink); opacity: 0.2;
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { opacity: 0.15; transform: scaleX(0.7); }
    50%     { opacity: 0.5;  transform: scaleX(1); }
  }

  /* ============ WEATHER ============ */
  #weather .grid {
    position: absolute; inset: clamp(32px,4vh,48px);
    bottom: clamp(110px,16vh,140px);
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px);
    grid-template-rows: 1fr;
    align-items: center; gap: clamp(16px,3vw,32px);
  }
  #weather .hero { z-index: 2; }
  .temperature {
    font-size: clamp(48px, 14vw, 168px); font-weight: 200;
    line-height: 0.92; letter-spacing: -0.04em;
    display: flex; align-items: flex-start;
  }
  .temperature .num { font-variant-numeric: tabular-nums; }
  .temperature .unit { font-size: 0.32em; font-weight: 300;
    margin-top: 0.35em; margin-left: 0.08em; color: var(--secondary); }
  #weather .condition {
    margin-top: clamp(8px,1.5vh,16px);
    font-size: clamp(16px,2vw,22px); letter-spacing: 0.32em;
    text-transform: uppercase;
  }
  #weather .glyph {
    position: relative; justify-self: end;
    width: clamp(220px, 36vw, 360px); height: clamp(220px, 36vw, 360px);
  }
  #weather .glyph svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }

  .rays, .wind-wobble, .pulse { transform-box: fill-box; transform-origin: 50% 50%; }
  .rays { animation: spin 18s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .arc-1 { animation: drift 12s linear infinite; }
  .arc-2 { animation: drift 18s linear infinite; animation-delay: -6s; }
  @keyframes drift {
    0%   { transform: translateX(-30%); opacity: 0; }
    15%  { opacity: 1; } 85% { opacity: 1; }
    100% { transform: translateX(30%); opacity: 0; }
  }
  .rain-line { animation: fall 6s var(--ease) infinite; transform-origin: top; }
  @keyframes fall {
    0% { transform: translateY(-100%); opacity: 0; }
    20% { opacity: 1; } 80% { opacity: 1; }
    100% { transform: translateY(120%); opacity: 0; }
  }
  .snow-wrap g { animation: descend 9s linear infinite; transform-origin: center; }
  @keyframes descend { 0% { transform: translateY(-110%); } 100% { transform: translateY(110%); } }
  .wind-wobble { animation: wobble 8s ease-in-out infinite; }
  @keyframes wobble {
    0%,100% { transform: translate(0,0); } 25% { transform: translate(2px,-1px); }
    50% { transform: translate(0,2px); } 75% { transform: translate(-2px,-1px); }
  }
  .pulse { animation: pulse 14s ease-in-out infinite; }
  @keyframes pulse {
    0%,100% { opacity: 0.5; transform: scale(1); }
    50%     { opacity: 1; transform: scale(1.02); }
  }

  /* ============ COMMUTE ============ */
  #commute .grid {
    position: absolute; inset: clamp(32px,4vh,48px);
    display: grid; grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr; align-items: center;
  }
  #commute .hero { z-index: 2; }
  #commute .eta-num {
    font-size: clamp(96px, 22vw, 264px); font-weight: 200;
    line-height: 0.92; letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    display: inline-flex; align-items: flex-start;
  }
  #commute .eta-num .u {
    font-size: 0.22em; font-weight: 300; color: var(--secondary);
    margin-top: 0.7em; margin-left: 0.1em; letter-spacing: 0;
  }
  #commute .dest {
    margin-top: clamp(8px,1.5vh,16px);
    font-size: clamp(16px,2vw,22px); letter-spacing: 0.32em;
    text-transform: uppercase;
  }
  #commute .lines-svg {
    position: relative; justify-self: end;
    width: clamp(280px, 40vw, 420px); height: clamp(220px, 36vw, 360px);
  }
  #commute .lines-svg svg { width:100%; height:100%; overflow:visible; }
  /* train dot animations */
  .train-dot {
    transform-box: fill-box; transform-origin: 0% 50%;
    animation-name: glide;
    animation-iteration-count: infinite;
    animation-timing-function: var(--ease);
  }
  @keyframes glide {
    0%   { transform: translateX(0); opacity: 0; }
    8%   { opacity: 1; }
    92%  { opacity: 1; }
    100% { transform: translateX(280px); opacity: 0; }
  }

  /* ============ LISTENING ============ */
  #listening .ring {
    position: absolute; left:50%; top:50%; transform: translate(-50%,-50%);
    width: 320px; height: 320px;
  }
  #listening .ring svg { width:100%; height:100%; }
  #listening .ring .r {
    transform-box: fill-box; transform-origin: 50% 50%;
    animation: ringpulse 1.6s ease-in-out infinite;
  }
  #listening .ring .r2 { animation-delay: -0.5s; }
  #listening .ring .r3 { animation-delay: -1.0s; }
  @keyframes ringpulse {
    0%   { transform: scale(0.5); opacity: 0; }
    20%  { opacity: 0.8; }
    100% { transform: scale(1.3); opacity: 0; }
  }
  #listening .label {
    position: absolute; left:50%; bottom: 18%; transform: translateX(-50%);
    font-size: clamp(14px,1.6vw,18px); letter-spacing: 0.32em;
    text-transform: uppercase; color: var(--secondary);
  }

  /* ============ GROCERY ============ */
  #grocery .g-stage {
    position: absolute; left: 0; right: 0; top: 0; bottom: 0;
    overflow: hidden;
  }
  #grocery .g-roll {
    position: absolute; left: clamp(32px,4vh,48px); right: clamp(32px,4vh,48px);
    top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 0;
    will-change: transform;
    animation: roll 24s linear infinite;
  }
  @keyframes roll {
    from { transform: translateY(50%); }
    to   { transform: translateY(-50%); }
  }
  #grocery .g-row {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: clamp(10px,1.5vh,14px) 0;
    border-bottom: 1px solid var(--hairline);
    font-size: clamp(20px,3vw,32px);
    font-weight: 300; letter-spacing: -0.01em;
  }
  #grocery .g-row .name { flex: 1; padding-right: 1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #grocery .g-row .status {
    font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--secondary); font-variant-numeric: tabular-nums;
  }
  #grocery .g-row .status.out { color: var(--accent); }
  #grocery .g-fade-top, #grocery .g-fade-bot {
    position: absolute; left: 0; right: 0; height: 30%;
    pointer-events: none; z-index: 2;
  }
  #grocery .g-fade-top { top: 0; background: linear-gradient(to bottom, var(--bg) 0%, rgba(0,0,0,0) 100%); }
  #grocery .g-fade-bot { bottom: 0; background: linear-gradient(to top, var(--bg) 0%, rgba(0,0,0,0) 100%); }

  /* ============ FLOORPLAN ============ */
  #floorplan .fp-stage {
    position: absolute; inset: clamp(32px,4vh,48px);
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    gap: clamp(20px,3vw,40px); align-items: center;
  }
  #floorplan .fp-canvas {
    position: relative; height: 100%; max-height: 70vh;
    aspect-ratio: 1320 / 1744;
    justify-self: end;
  }
  #floorplan .fp-canvas img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 1;
  }
  html[data-theme="dark"] #floorplan .fp-canvas img,
  body.face-floorplan #floorplan .fp-canvas img { opacity: 0.85; filter: invert(1) hue-rotate(180deg); }
  #floorplan .fp-svg {
    position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible;
  }
  #floorplan .fp-room {
    fill: transparent; stroke: var(--hairline); stroke-width: 1.2;
    cursor: pointer; transition: fill 600ms var(--ease), stroke 200ms var(--ease);
    vector-effect: non-scaling-stroke;
    pointer-events: all;            /* register clicks on transparent fill */
  }
  #floorplan .fp-room.lit { fill: rgba(232, 168, 92, 0.32); stroke: rgba(232, 168, 92, 0.7); }
  #floorplan .fp-room.active { stroke: var(--ink); stroke-width: 2; }
  #floorplan .fp-room.door-open { stroke: var(--accent); stroke-width: 2; }
  #floorplan .fp-motion {
    fill: var(--ink); opacity: 0; transform-box: fill-box; transform-origin: center;
    animation: fpPulse 2.4s ease-in-out infinite;
  }
  @keyframes fpPulse {
    0%,100% { opacity: 0; transform: scale(0.6); }
    50%     { opacity: 0.55; transform: scale(1.4); }
  }
  #floorplan .fp-label {
    fill: var(--secondary); font-size: 38px; font-weight: 400;
    letter-spacing: 4px; text-transform: uppercase; pointer-events: none;
    transition: fill 200ms var(--ease);
  }
  #floorplan .fp-room.lit + .fp-label, #floorplan .fp-label.lit { fill: var(--ink); }
  #floorplan .fp-temp {
    fill: var(--secondary); font-size: 30px; font-weight: 300;
    font-variant-numeric: tabular-nums; pointer-events: none;
  }

  #floorplan .fp-side {
    align-self: stretch; padding: clamp(8px,2vh,16px) 0;
    display: flex; flex-direction: column; gap: clamp(20px,3vh,32px);
    justify-content: center;
  }
  #floorplan .fp-side .lead-label {
    font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--secondary);
  }
  #floorplan .fp-side .lead-room {
    font-size: clamp(36px, 5.4vw, 64px); font-weight: 200; line-height: 1; letter-spacing: -0.02em;
    margin-top: 8px;
  }
  #floorplan .fp-stats { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(14px,2vh,22px); }
  #floorplan .fp-stat .k { font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--secondary); }
  #floorplan .fp-stat .v {
    font-size: clamp(22px, 2.8vw, 30px); font-weight: 300; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums; margin-top: 4px;
  }
  #floorplan .fp-stat .v .u { font-size: 0.55em; color: var(--secondary); margin-left: 0.25em; }
  #floorplan .fp-stat .v.muted { color: var(--secondary); }
  #floorplan .fp-light {
    border-top: 1px solid var(--hairline); padding-top: clamp(12px,2vh,18px);
    display: flex; flex-direction: column; gap: clamp(10px,1.5vh,14px);
  }
  #floorplan .fp-light .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  #floorplan .fp-light .k { font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--secondary); }
  #floorplan .fp-light .toggle {
    appearance: none; border: 1px solid var(--hairline); background: transparent;
    color: var(--ink); padding: 8px 18px; font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase;
    cursor: pointer; transition: background 160ms var(--ease), color 160ms var(--ease), border-color 160ms var(--ease);
    font-family: inherit;
  }
  #floorplan .fp-light .toggle.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  #floorplan .fp-light .toggle:active { transform: scale(0.97); }
  #floorplan .fp-light .slider-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; }
  #floorplan .fp-light input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 2px;
    background: var(--hairline); outline: none; border-radius: 999px;
  }
  #floorplan .fp-light input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
    border-radius: 50%; background: var(--ink); cursor: pointer; border: 0;
  }
  #floorplan .fp-light input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%; background: var(--ink); cursor: pointer; border: 0;
  }
  #floorplan .fp-light .pct { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--secondary); min-width: 3em; text-align: right; }
  #floorplan .fp-light.disabled { opacity: 0.5; pointer-events: none; }
  #floorplan .fp-light .slider-row.disabled { opacity: 0.4; pointer-events: none; }
  #floorplan .fp-empty { color: var(--secondary); font-size: 13px; letter-spacing: 0.06em; }
  #grocery .g-counter {
    position: absolute; left: 50%; bottom: clamp(32px,4vh,48px);
    transform: translateX(-50%);
    font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--secondary); z-index: 3;
  }
  /* ============ ACK ============ */
  #ack .ack-stage {
    position: absolute; left: clamp(32px,4vh,48px); right: clamp(32px,4vh,48px);
    top: 50%; transform: translateY(-50%); text-align: left;
    font-size: clamp(24px, 3.6vw, 52px);
    font-weight: 200; line-height: 1.15; letter-spacing: -0.01em;
    text-wrap: pretty; word-wrap: break-word;
    max-height: 70vh; overflow: hidden;
  }
  #ack .ack-stage.long { font-size: clamp(18px, 2.6vw, 36px); line-height: 1.25; }
  #ack .ack-char {
    display: inline-block; opacity: 0;
    transform: translateY(0.3em);
    animation: charpop 320ms var(--ease) forwards;
  }
  #ack .ack-char.space { width: 0.32em; }
  @keyframes charpop {
    0%   { opacity: 0; transform: translateY(0.5em); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    *,*::before,*::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<script>
(() => {
  // DEMO=true seeds fixtures + auto-rotates faces every 6s. Set false for live HA.
  const DEMO = !location.search.includes("live=1");
  const HA_URL = "ws://__HA_HOST__:8123/api/websocket";
  // Token can be overridden via localStorage.setItem('ha_token','...') so source stays clean.
  const HA_TOKEN = (typeof localStorage!=="undefined" && localStorage.getItem("ha_token")) || "__HA_TOKEN__";
  const ENTITIES = [
    "input_select.jarvis_card",
    "input_select.jarvis_input_mode",
    "weather.forecast_home",
    "sensor.path_grove_st_to_wtc",
    "sensor.path_grove_st_to_33rd",
    "sensor.travel_time_28_liberty",
    "sensor.travel_time_30_irving",
    "input_text.jarvis_last_speech",
    "sensor.groceries_low",
    // Room lights — match ROOM_LIGHTS above
    "light.bedroom", "light.office",
    "light.kitchen", "light.social_area",
    "light.living_room_lights", "light.hallway",
    "light.master_bathroom", "light.guest_bathroom_2",
  ];
  const state = {};

  const $ = (id) => document.getElementById(id);
  const SVG_NS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs = {}) => {
    const el = document.createElementNS(SVG_NS, tag);
    for (const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
    return el;
  };

  // ---------- weather glyph ----------
  function renderWeatherGlyph(s) {
    const root = $("w-glyph"); root.innerHTML = "";
    const svg = svgEl("svg", { viewBox: "0 0 200 200" });
    root.appendChild(svg);
    const cx = 110, cy = 90, r = 46;
    const drawCircle = (klass = "stroke") => svg.appendChild(svgEl("circle", { cx, cy, r, class: klass }));

    if (!s || s === "sunny" || s === "clear") {
      const rays = svgEl("g", { class: "rays" });
      for (let i = 0; i < 12; i++) {
        const a = (i*360)/12;
        const x1 = cx + Math.cos(a*Math.PI/180)*(r+14);
        const y1 = cy + Math.sin(a*Math.PI/180)*(r+14);
        const x2 = cx + Math.cos(a*Math.PI/180)*(r+34);
        const y2 = cy + Math.sin(a*Math.PI/180)*(r+34);
        rays.appendChild(svgEl("line", { x1,y1,x2,y2, class: "stroke stroke-accent", "stroke-width": "1.6" }));
      }
      svg.appendChild(rays); drawCircle();
    } else if (s === "partlycloudy") {
      const rays = svgEl("g", { class: "rays" });
      for (let i = 0; i < 12; i++) {
        const a = (i*360)/12;
        const x1 = cx + Math.cos(a*Math.PI/180)*(r+14);
        const y1 = cy + Math.sin(a*Math.PI/180)*(r+14);
        const x2 = cx + Math.cos(a*Math.PI/180)*(r+30);
        const y2 = cy + Math.sin(a*Math.PI/180)*(r+30);
        rays.appendChild(svgEl("line", { x1,y1,x2,y2, class: "stroke stroke-secondary" }));
      }
      svg.appendChild(rays); drawCircle();
      const arc = svgEl("g", { class: "arc-1" });
      arc.appendChild(svgEl("path", { d:"M 40 130 Q 100 110 170 130", class: "stroke stroke-secondary" }));
      svg.appendChild(arc);
    } else if (s === "cloudy") {
      // Fluffy clouds: overlapping filled circles, two layers drifting
      const cloud = (circles, opacity) => {
        const g = svgEl("g");
        circles.forEach(([cx,cy,r]) => g.appendChild(svgEl("circle",{
          cx, cy, r, fill: "currentColor", stroke: "none", "fill-opacity": opacity
        })));
        return g;
      };
      // Back cloud — smaller, higher, faded
      const back = svgEl("g", { class: "arc-2" });
      back.appendChild(cloud([[62,78,14],[80,68,18],[100,70,17],[118,78,13],[80,84,10],[100,84,10]], 0.22));
      svg.appendChild(back);
      // Front cloud — larger, centered, opaque
      const front = svgEl("g", { class: "arc-1" });
      front.appendChild(cloud([
        [55,128,18],[78,112,24],[106,110,24],[132,118,22],[152,128,17],
        [78,134,16],[106,136,16],[132,136,14],[55,138,12],[152,138,11]
      ], 0.92));
      svg.appendChild(front);
    } else if (s === "rainy" || s === "pouring") {
      drawCircle();
      const xs=[40,70,100,130,160,55,85,115,145], ds=[0,-1,-2,-3,-4,-0.5,-1.5,-2.5,-3.5];
      const g = svgEl("g");
      xs.forEach((x,i)=>{
        const ln = svgEl("line",{x1:x,y1:130,x2:x,y2:150,class:"stroke rain-line","stroke-width": s==="pouring"?"1.6":"1.2"});
        ln.style.animationDelay = `${ds[i]}s`; g.appendChild(ln);
      });
      svg.appendChild(g);
    } else if (s === "snowy") {
      drawCircle();
      const wrap = svgEl("g", { class:"snow-wrap" });
      const xs=[40,70,100,130,160,55,85,115,145], ds=[0,-1,-2,-3,-4,-1.2,-2.4,-3.6,-4.8];
      xs.forEach((x,i)=>{
        const gg = svgEl("g"); gg.style.animationDelay = `${ds[i]}s`;
        gg.appendChild(svgEl("circle",{cx:x,cy:30,r:1.4,fill:"currentColor",stroke:"none"}));
        wrap.appendChild(gg);
      });
      svg.appendChild(wrap);
    } else if (s === "windy" || s === "windy-variant") {
      const wob = svgEl("g",{class:"wind-wobble"}); wob.appendChild(svgEl("circle",{cx,cy,r,class:"stroke"})); svg.appendChild(wob);
      const a1 = svgEl("g",{class:"arc-1"}); a1.appendChild(svgEl("path",{d:"M 10 70 Q 100 64 200 70",class:"stroke stroke-secondary"})); svg.appendChild(a1);
      const a2 = svgEl("g",{class:"arc-2"}); a2.appendChild(svgEl("path",{d:"M 10 110 Q 100 104 200 110",class:"stroke stroke-secondary"})); svg.appendChild(a2);
    } else if (s === "clear-night" || (s && s.includes("night"))) {
      const g = svgEl("g",{class:"pulse"});
      g.appendChild(svgEl("circle",{cx,cy,r,class:"stroke"}));
      g.appendChild(svgEl("circle",{cx:cx+18,cy:cy-14,r:r*0.92,class:"stroke stroke-secondary"}));
      svg.appendChild(g);
    } else {
      renderWeatherGlyph("sunny");
    }
  }

  // ---------- commute glyph: two horizontal lines + animated dots ----------
  function renderCommuteGlyph(wtcMin, t33Min) {
    const root = $("c-glyph"); root.innerHTML = "";
    const svg = svgEl("svg", { viewBox: "0 0 320 220" });
    root.appendChild(svg);

    // line 1 (WTC)
    svg.appendChild(svgEl("line", { x1: 20, y1: 70, x2: 300, y2: 70, class: "stroke" }));
    svg.appendChild(svgEl("text", { x: 20, y: 50, fill: "currentColor", "font-family": "Helvetica Neue, Helvetica, Arial",
      "font-size": "13", "letter-spacing": "3", "text-transform": "uppercase" })).textContent = "WTC LINE";
    // line 2 (33rd)
    svg.appendChild(svgEl("line", { x1: 20, y1: 160, x2: 300, y2: 160, class: "stroke stroke-secondary" }));
    svg.appendChild(svgEl("text", { x: 20, y: 140, fill: "currentColor", "font-family": "Helvetica Neue, Helvetica, Arial",
      "font-size": "13", "letter-spacing": "3" })).textContent = "33rd LINE";

    // dot speed: shorter wait → faster glide
    function addDot(yLine, mins, accent) {
      const dot = svgEl("circle", { cx: 20, cy: yLine, r: 5, fill: "currentColor", stroke: "none", class: "train-dot" });
      const dur = (typeof mins === "number" && mins > 0) ? Math.min(12, 2 + mins * 1.2) : 8;
      dot.style.animationDuration = `${dur}s`;
      if (accent) dot.setAttribute("fill", "var(--accent)");
      svg.appendChild(dot);
    }
    addDot(70, wtcMin, true);
    addDot(160, t33Min, false);
  }

  // ---------- helpers ----------
  function num(v) { const n = parseInt(String(v).match(/-?\d+/)?.[0] ?? ""); return Number.isFinite(n) ? n : null; }
  function fmtClock() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  }
  function fmtETA(mins) {
    if (typeof mins !== "number") return "—";
    const t = new Date(Date.now() + mins*60000);
    let h = t.getHours(), m = t.getMinutes();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    return `${h}:${String(m).padStart(2,"0")} ${ap}`;
  }
  function fmtDate() {
    const d = new Date();
    return d.toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric" }).toUpperCase();
  }

  // ---------- per-face renderers ----------
  const STATE_LABEL = {
    sunny:"SUNNY", clear:"CLEAR", "clear-night":"CLEAR NIGHT", partlycloudy:"PARTLY CLOUDY",
    cloudy:"CLOUDY", rainy:"RAIN", pouring:"HEAVY RAIN", snowy:"SNOW",
    windy:"WIND", "windy-variant":"WIND", fog:"FOG", hail:"HAIL",
    lightning:"STORM", "lightning-rainy":"STORM", exceptional:"EXTREME"
  };

  function renderHome() {
    $("home-time").textContent = fmtClock();
    $("home-date").textContent = fmtDate();
    $("home-index").textContent = fmtDate().split(",")[0];
    const w = state["weather.forecast_home"];
    const t = w?.attributes?.temperature;
    $("home-temp").textContent = (typeof t === "number") ? Math.round(t) : "—";
    const lib = num(state["sensor.travel_time_28_liberty"]?.state);
    const irv = num(state["sensor.travel_time_30_irving"]?.state);
    $("home-lib").textContent = lib ?? "—";
    $("home-irv").textContent = irv ?? "—";
  }

  function renderWeather() {
    $("w-clock").textContent = fmtClock();
    const w = state["weather.forecast_home"];
    if (!w) { ["w-temp","w-cond","w-hum","w-wind","w-state"].forEach(i=>$(i).textContent="—"); $("w-unit").textContent="°"; renderWeatherGlyph(null); return; }
    const a = w.attributes || {};
    const tu = (a.temperature_unit || "°C").replace("°","").trim();
    $("w-temp").textContent = (typeof a.temperature === "number") ? Math.round(a.temperature) : "—";
    $("w-unit").textContent = tu ? `°${tu}` : "°";
    $("w-cond").textContent = STATE_LABEL[w.state] || (w.state||"—").toUpperCase();
    $("w-state").textContent = STATE_LABEL[w.state] || (w.state||"—");
    $("w-hum").textContent = (typeof a.humidity === "number") ? Math.round(a.humidity) : "—";
    $("w-wind").textContent = (typeof a.wind_speed === "number") ? Math.round(a.wind_speed) : "—";
    $("w-windunit").textContent = a.wind_speed_unit || "";
    const isNight = w.state === "clear-night" || (w.state && w.state.includes("night"));
    document.documentElement.dataset.theme = isNight ? "dark" : "light";
    renderWeatherGlyph(w.state);
  }

  let commuteHeroIdx = 0;
  function commuteHero() {
    const lib = num(state["sensor.travel_time_28_liberty"]?.state);
    const irv = num(state["sensor.travel_time_30_irving"]?.state);
    const opts = [];
    if (lib != null) opts.push({m: lib, d: "28 LIBERTY"});
    if (irv != null) opts.push({m: irv, d: "30 IRVING"});
    if (!opts.length) return null;
    return opts[commuteHeroIdx % opts.length];
  }
  function paintCommuteHero() {
    const h = commuteHero();
    const eta = $("c-eta"), dest = $("c-dest");
    eta.style.transition = "opacity 400ms var(--ease)";
    dest.style.transition = "opacity 400ms var(--ease)";
    eta.style.opacity = 0; dest.style.opacity = 0;
    setTimeout(()=>{
      eta.textContent = h ? h.m : "—";
      dest.textContent = h ? h.d : "—";
      eta.style.opacity = 1; dest.style.opacity = 1;
    }, 400);
  }
  // Commute hero: alternate every 7s; pause 4s after manual tap.
  let commutePauseUntil = 0;
  setInterval(()=>{
    const active = state["input_select.jarvis_card"]?.state || "home";
    if (active !== "commute") return;
    if (Date.now() < commutePauseUntil) return;
    commuteHeroIdx++;
    paintCommuteHero();
  }, 7000);

  function renderCommute() {
    $("c-clock").textContent = fmtClock();
    const wtc = num(state["sensor.path_grove_st_to_wtc"]?.state);
    const t33 = num(state["sensor.path_grove_st_to_33rd"]?.state);
    const irv = num(state["sensor.travel_time_30_irving"]?.state);
    const h = commuteHero();
    $("c-eta").textContent = h ? h.m : "—";
    $("c-dest").textContent = h ? h.d : "—";
    $("c-wtc").textContent = wtc ?? "—";
    $("c-33").textContent = t33 ?? "—";
    $("c-irv-eta").textContent = (irv != null) ? fmtETA(irv) : "—";
    renderCommuteGlyph(wtc, t33);
  }

  function renderListening() { $("l-clock").textContent = fmtClock(); }

  // ---------- floorplan ----------
  const ROOMS = [
    { id: "bedroom2", label: "Bedroom 2",   poly: "160,230 160,676 510,676 510,251 490,272 385,272 385,232", motionAt: [340, 430], tempEntity: "sensor.temp_bedroom2" },
    { id: "kitchen",  label: "Kitchen",     poly: "532,229 740,229 740,283 732,283 732,668 538,668", motionAt: [630, 540], tempEntity: "sensor.temp_kitchen" },
    { id: "dining",   label: "Dining",      poly: "862,231 1146,231 1146,478 1108,478 1108,620 734,620 734,283 858,283", motionAt: [940, 430] },
    { id: "bath2",    label: "Bath",        poly: "474,684 474,974 712,974 712,768 640,768 640,684", motionAt: [580, 880] },
    { id: "living",   label: "Living Room", poly: "740,620 1086,620 1086,694 1146,694 1146,860 1108,860 1108,985 1146,985 1146,1090 740,1090", motionAt: [940, 940], tempEntity: "sensor.temp_living" },
    { id: "hallway",  label: "Hall",        poly: "204,1106 204,872 346,872 346,684 472,684 472,978 736,978 736,1106", motionAt: [560, 1040] },
    { id: "bedroom1", label: "Bedroom 1",   poly: "580,1108 1020,1108 1020,1180 1146,1180 1146,1584 712,1584 712,1360 580,1360", motionAt: [940, 1440], tempEntity: "sensor.temp_bedroom1" },
    { id: "bath1",    label: "Bath",        poly: "350,1408 428,1408 444,1360 696,1360 696,1572 350,1572", motionAt: [550, 1480] },
    { id: "closet_gui", label: "Closet",    poly: "160,680 338,680 338,752 268,752 268,852 160,852" },
    { id: "closet_ra",  label: "Closet",    poly: "354,1340 574,1340 574,1108 466,1108 466,1200 354,1200" },
    { id: "wd",         label: "W/D",       poly: "360,1108 444,1108 444,1192 360,1192" },
  ];

  let fpSelected = "living";

  function buildFloorplan() {
    const svg = $("fp-svg");
    if (svg.dataset.built) return;
    svg.innerHTML = "";
    ROOMS.forEach(r => {
      const poly = svgEl("polygon", { points: r.poly, class: "fp-room", "data-room": r.id });
      fpSelected = r.id; renderFloorplan(); });
      svg.appendChild(poly);
      if (r.motionAt) {
        const dot = svgEl("circle", { cx: r.motionAt[0], cy: r.motionAt[1], r: 14, class: "fp-motion", "data-room-motion": r.id });
        dot.style.opacity = 0;
        svg.appendChild(dot);
      }
    });
    svg.dataset.built = "1";
  }

  // Map our room IDs to actual HA light entities. Override for any apartment.
  const ROOM_LIGHTS = {
    bedroom1: "light.bedroom",
    bedroom2: "light.office",
    kitchen:  "light.kitchen",
    dining:   "light.social_area",
    living:   "light.living_room_lights",
    hallway:  "light.hallway",
    bath1:    "light.master_bathroom",
    bath2:    "light.guest_bathroom_2",
  };
  function lightEntity(roomId) { return ROOM_LIGHTS[roomId] || ("light." + roomId); }
  const ROOMS_WITH_LIGHTS = new Set(Object.keys(ROOM_LIGHTS));
  if (typeof window.fpUserTouched === "undefined") window.fpUserTouched = new Set();

  function callLightService(roomId, payload) {
    const entity = lightEntity(roomId);
    if (DEMO) {
      if (payload.turn === "off") {
        state[entity] = { state: "off", attributes: {} };
      } else {
        const cur = state[entity] || { state: "off", attributes: {} };
        const bri = (payload.brightness != null) ? payload.brightness : (cur.attributes?.brightness ?? 200);
        state[entity] = { state: "on", attributes: { brightness: bri } };
      }
      renderFloorplan();
      return;
    }
    if (!ws || ws.readyState !== 1) return;
    const service = payload.turn === "off" ? "turn_off" : "turn_on";
    const data = { entity_id: entity };
    if (service === "turn_on" && payload.brightness != null) data.brightness = payload.brightness;
    ws.send(JSON.stringify({ id: msgId++, type: "call_service", domain: "light", service, service_data: data }));
  }

  function renderFloorplan() {
    $("fp-clock").textContent = fmtClock();
    buildFloorplan();
    const svg = $("fp-svg");
    ROOMS.forEach(r => {
      const lightOn = state[lightEntity(r.id)]?.state === "on";
      const motion  = state["binary_sensor.motion_"+r.id]?.state === "on";
      const poly = svg.querySelector('.fp-room[data-room="'+r.id+'"]');
      const dot  = svg.querySelector('[data-room-motion="'+r.id+'"]');
      poly.classList.toggle("lit", lightOn);
      poly.classList.toggle("active", fpSelected === r.id);
      if (dot) dot.style.opacity = motion ? "" : "0";
    });

    const sel = ROOMS.find(r => r.id === fpSelected) || ROOMS[0];
    $("fp-active-room").textContent = sel.label;

    // Stats — only those the room actually has data for
    const stats = [];
    if (sel.tempEntity) {
      const v = state[sel.tempEntity]?.state;
      if (v != null) stats.push({ k: "Temp", v: Math.round(parseFloat(v)) + '<span class="u">°C</span>' });
    }
    const humEnt = "sensor.humidity_"+sel.id;
    if (state[humEnt]) {
      stats.push({ k: "Humidity", v: Math.round(parseFloat(state[humEnt].state)) + '<span class="u">%</span>' });
    }
    if (state["binary_sensor.motion_"+sel.id]) {
      const m = state["binary_sensor.motion_"+sel.id].state === "on";
      stats.push({ k: "Activity", v: m ? "Now" : "Quiet", muted: !m });
    }
    $("fp-stats").innerHTML = stats.length
      ? stats.map(s => '<div class="fp-stat"><div class="k">'+s.k+'</div><div class="v'+(s.muted?' muted':'')+'">'+s.v+'</div></div>').join("")
      : '<div class="fp-empty">No sensors in this room.</div>';

    // Light controls
    const lightHost = $("fp-light");
    if (!ROOMS_WITH_LIGHTS.has(sel.id)) {
      lightHost.innerHTML = '<div class="row"><span class="k">Light</span><span class="fp-empty">No fixtures</span></div>';
      return;
    }
    const lightSt = state[lightEntity(sel.id)];
    const on = lightSt?.state === "on";
    const bri = on ? (lightSt?.attributes?.brightness ?? 200) : 0;
    const pct = Math.round(bri / 255 * 100);
    lightHost.innerHTML =
      '<div class="row">' +
        '<span class="k">Light</span>' +
        '<button class="toggle '+(on?"on":"")+'" data-fp-toggle>'+(on?"On":"Off")+'</button>' +
      '</div>' +
      '<div class="slider-row '+(on?"":"disabled")+'">' +
        '<span class="k">Bright</span>' +
        '<input type="range" min="5" max="100" value="'+(on?pct:50)+'" data-fp-bri />' +
        '<span class="pct" data-fp-pct>'+(on?pct:0)+'%</span>' +
      '</div>';
    const toggleBtn = lightHost.querySelector("[data-fp-toggle]");
    const slider    = lightHost.querySelector("[data-fp-bri]");
    const pctEl     = lightHost.querySelector("[data-fp-pct]");
    toggleBtn.addEventListener("click", () => {
      window.fpUserTouched.add(sel.id);
      callLightService(sel.id, { turn: on ? "off" : "on" });
    });
    if (slider) {
      slider.addEventListener("input", (e) => { pctEl.textContent = e.target.value + "%"; });
      slider.addEventListener("change", (e) => {
        const v = parseInt(e.target.value, 10);
        window.fpUserTouched.add(sel.id);
        callLightService(sel.id, { turn: "on", brightness: Math.round(v / 100 * 255) });
      });
    }
  }

  function renderGrocery() {
    $("g-clock").textContent = fmtClock();
    const sens = state["sensor.groceries_low"];
    const items = sens?.attributes?.items || [];
    const roll = $("g-roll");
    if (!items.length) {
      roll.innerHTML = '<div class="g-row"><span class="name">Nothing on the list</span></div>';
      $("g-count").textContent = "—";
      return;
    }
    // duplicate the list for seamless loop
    const html = (items.concat(items)).map(it => {
      const status = (it.status || "").toLowerCase();
      const cls = status === "out" ? "out" : "";
      return '<div class="g-row"><span class="name">'+escapeHtml(it.item || "")+'</span><span class="status '+cls+'">'+ (status || '').toUpperCase() +'</span></div>';
    }).join("");
    if (roll.dataset.signature !== JSON.stringify(items)) {
      roll.innerHTML = html;
      roll.dataset.signature = JSON.stringify(items);
      // dynamic duration based on count
      const dur = Math.max(18, items.length * 2.4);
      roll.style.animationDuration = dur + 's';
    }
    $("g-count").textContent = items.length + ' item' + (items.length === 1 ? '' : 's');
  }
  function escapeHtml(t) {
    return String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
  }

  let lastAckText = null;
  function renderAck(force) {
    $("a-clock").textContent = fmtClock();
    const t = state["input_text.jarvis_last_speech"]?.state || "";
    if (!force && t === lastAckText) return;
    lastAckText = t;
    const stage = $("a-stage");
    stage.innerHTML = "";
    const text = (t || "—").trim();
    [...text].forEach((ch, i) => {
      const span = document.createElement("span");
      span.className = "ack-char" + (ch === " " ? " space" : "");
      span.textContent = ch === " " ? " " : ch;
      span.style.animationDelay = (i * 28) + "ms";
      stage.appendChild(span);
    });
  }

  // ---------- face switcher ----------
  const VALID_FACES = ["home","weather","commute","listening","ack","grocery","floorplan"];
  function showFace(name) {
    if (!VALID_FACES.includes(name)) name = "home";
    document.querySelectorAll(".face").forEach(el => el.classList.toggle("active", el.id === name));
    // Per-face mood class on body
    VALID_FACES.forEach(f => document.body.classList.toggle("face-"+f, f===name));
    // Mark ack as long if it overflows
    if (name === "ack") {
      const t = (state["input_text.jarvis_last_speech"]?.state || "");
      $("a-stage").classList.toggle("long", t.length > 80);
    }
  }

  function renderAll() {
    renderHome(); renderWeather(); renderCommute(); renderListening(); renderAck(); renderGrocery();
    applyMode();
    highlightNav(state["input_select.jarvis_card"]?.state || "home"); renderFloorplan();
    const lockFace = new URLSearchParams(location.search).get("face");
    const active = lockFace || state["input_select.jarvis_card"]?.state || "home";
    showFace(active);
  }

  // ---------- HA WebSocket ----------
  let ws=null, msgId=1, reconnectTimer=null;
  function connect() {
    try { ws = new WebSocket(HA_URL); } catch { scheduleReconnect(); return; }
    ws.addEventListener("message", ev => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === "auth_required") ws.send(JSON.stringify({type:"auth", access_token: HA_TOKEN}));
      else if (m.type === "auth_ok") {
        ws.send(JSON.stringify({id: msgId++, type:"get_states"}));
        ws.send(JSON.stringify({id: msgId++, type:"subscribe_events", event_type:"state_changed"}));
      }
      else if (m.type === "result" && Array.isArray(m.result)) {
        for (const e of m.result) if (ENTITIES.includes(e.entity_id)) state[e.entity_id] = e;
        renderAll();
      }
      else if (m.type === "event" && m.event?.event_type === "state_changed") {
        const d = m.event.data;
        if (d && ENTITIES.includes(d.entity_id) && d.new_state) {
          const wasCard = (d.entity_id === "input_select.jarvis_card");
          const newAck = wasCard && d.new_state.state === "ack";
          state[d.entity_id] = d.new_state;
          if (newAck) renderAck(true);
          renderAll();
        }
      }
    });
    ws.addEventListener("open", () => setConn(true));
    ws.addEventListener("close", () => { setConn(false); scheduleReconnect(); });
    ws.addEventListener("error", () => { setConn(false); try { ws.close(); } catch {} });
  }
  function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(()=>{ reconnectTimer=null; connect(); }, 2000);
  }

  // Tick clocks: 1s on home (active), 10s on auxiliary index clocks.
  setInterval(()=>{
    $("home-time").textContent = fmtClock();
    $("home-date").textContent = fmtDate();
  }, 1000);
  setInterval(()=>{
    $("w-clock").textContent = fmtClock();
    $("c-clock").textContent = fmtClock();
    $("l-clock").textContent = fmtClock();
    $("g-clock").textContent = fmtClock();
    $("a-clock").textContent = fmtClock();
  }, 10000);

  // ---------- connection bar ----------
  function setConn(connected) {
    document.getElementById("conn-bar").classList.toggle("disconnected", !connected);
  }

  // ---------- burn-in: dim + drift after 5min idle ----------
  let idleTimer=null;
  function bumpIdle(){ document.body.classList.remove("idle-dim"); clearTimeout(idleTimer);
    idleTimer = setTimeout(()=>document.body.classList.add("idle-dim"), 5*60*1000); }
  document.addEventListener("pointerdown", bumpIdle);
  bumpIdle();

  // ---------- mode + nav active pill ----------
  // URL overrides — read once at boot
  const urlParams = new URLSearchParams(location.search);
  const HERE = urlParams.get("here");           // room id this device lives in (kept for future "you are here" hint)
  const URL_MODE = urlParams.get("mode");        // optional: lock mode to "voice"|"touch"|"both"
  function applyMode() {
    const mode = URL_MODE || state["input_select.jarvis_input_mode"]?.state || "both";
    document.body.dataset.mode = mode;
    const lbl = document.getElementById("mode-label");
    if (lbl) lbl.textContent = mode.toUpperCase();
  }
  function highlightNav(activeFace) {
    document.querySelectorAll(".nav-bar .nav-pill").forEach(p => {
      p.classList.toggle("active", p.dataset.flip === activeFace);
    });
  }
  // Cycle mode on toggle button: voice -> touch -> both -> voice
  (() => {
    const btn = document.getElementById("mode-toggle");
    if (!btn) return;
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const cur = state["input_select.jarvis_input_mode"]?.state || "both";
      const next = cur === "voice" ? "touch" : cur === "touch" ? "both" : "voice";
      // Optimistic local update so it feels instant
      state["input_select.jarvis_input_mode"] = { state: next };
      applyMode();
      // Ask HA to persist if connected
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({
          id: msgId++, type: "call_service",
          domain: "input_select", service: "select_option",
          service_data: { entity_id: "input_select.jarvis_input_mode", option: next }
        }));
      }
    });
  })();

  // ---------- grocery swipe-to-remove ----------
  function callRemoveFromList(item) {
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({
        id: msgId++, type: "call_service",
        domain: "rest_command", service: "groceries_remove_from_list",
        service_data: { item }
      }));
    }
  }
  (() => {
    const stage = document.querySelector("#grocery .g-stage");
    const roll = document.getElementById("g-roll");
    if (!stage || !roll) return;

    // Tap-to-pause: clicking the stage (without a row swipe) toggles manual scroll mode
    let downX=0, downY=0, downOnRow=false;
    stage.addEventListener("pointerdown", (e) => {
      downX = e.clientX; downY = e.clientY;
      downOnRow = !!e.target.closest(".g-row");
    });
    stage.addEventListener("pointerup", (e) => {
      const dx = Math.abs(e.clientX - downX), dy = Math.abs(e.clientY - downY);
      if (dx < 6 && dy < 6 && !downOnRow) {
        stage.classList.toggle("paused");
      }
    });
    const SWIPE_THRESHOLD_RATIO = 0.35;
    let active = null, startX = 0, startY = 0, lockedAxis = null, resumeTimer = null;

    const pauseRoll = () => { roll.style.animationPlayState = "paused"; clearTimeout(resumeTimer); };
    const scheduleResume = () => {
      clearTimeout(resumeTimer);
      resumeTimer = setTimeout(() => { roll.style.animationPlayState = "running"; }, 3000);
    };

    stage.addEventListener("pointerdown", (e) => {
      const row = e.target.closest(".g-row");
      if (!row) return;
      active = row; startX = e.clientX; startY = e.clientY; lockedAxis = null;
      pauseRoll();
      row.classList.add("swiping");
      row.setPointerCapture && row.setPointerCapture(e.pointerId);
    });
    stage.addEventListener("pointermove", (e) => {
      if (!active) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (!lockedAxis && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
        lockedAxis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
      }
      if (lockedAxis === "x") {
        const w = active.offsetWidth || stage.offsetWidth;
        const ratio = Math.min(1, Math.abs(dx) / w);
        active.style.transform = "translateX(" + dx + "px)";
        active.style.opacity = String(1 - 0.6 * ratio);
      }
    });
    stage.addEventListener("pointerup", (e) => {
      if (!active) return;
      const dx = e.clientX - startX;
      const w = active.offsetWidth || stage.offsetWidth;
      const past = Math.abs(dx) > w * SWIPE_THRESHOLD_RATIO && lockedAxis === "x";
      const row = active; active = null;
      row.classList.remove("swiping");
      if (past) {
        const dir = dx > 0 ? 1 : -1;
        const itemName = row.querySelector(".name") ? row.querySelector(".name").textContent : "";
        row.classList.add("dismissing");
        row.style.transform = "translateX(" + (dir * w * 1.4) + "px)";
        row.style.opacity = "0";
        setTimeout(() => { if (itemName) callRemoveFromList(itemName); }, 350);
      } else {
        row.classList.add("dismissing");
        row.style.transform = "";
        row.style.opacity = "";
        setTimeout(() => row.classList.remove("dismissing"), 350);
      }
      scheduleResume();
    });
    stage.addEventListener("pointercancel", () => {
      if (active) {
        active.classList.remove("swiping");
        active.style.transform = ""; active.style.opacity = "";
        active = null;
      }
      scheduleResume();
    });
  })();

  // ---------- DEMO seed ----------
  if (typeof fpUserTouched === "undefined") { window.fpUserTouched = new Set(); }
  function seedDemo(faceIdx) {
    const cycle = ["sunny","partlycloudy","cloudy","rainy","snowy","windy","clear-night"];
    const w = cycle[faceIdx % cycle.length];
    const temps = { sunny:24, partlycloudy:19, cloudy:14, rainy:11, snowy:-2, windy:16, "clear-night":9 };
    state["weather.forecast_home"] = { state: w, attributes: {
      temperature: temps[w], temperature_unit: "°C",
      humidity: 30 + ((faceIdx*11)%55), wind_speed: 4 + ((faceIdx*7)%30), wind_speed_unit: "km/h"
    }};
    state["sensor.path_grove_st_to_wtc"] = { state: String(2 + (faceIdx%6)) };
    state["sensor.path_grove_st_to_33rd"] = { state: String(4 + ((faceIdx+2)%7)) };
    state["sensor.travel_time_28_liberty"] = { state: String(18 + (faceIdx%6)) };
    state["sensor.travel_time_30_irving"] = { state: String(22 + ((faceIdx+1)%5)) };
    state["input_text.jarvis_last_speech"] = { state: "Switching the kitchen lights to evening, lowering the thermostat to sixty-eight, and setting the dishwasher to run at ten." };
    state["sensor.groceries_low"] = { state: "6", attributes: { items: [
      { item: "Olive oil", status: "low" }, { item: "Coffee beans", status: "out" },
      { item: "Eggs", status: "low" }, { item: "Sourdough", status: "out" },
      { item: "Greek yogurt", status: "low" }, { item: "Lemons", status: "low" }
    ]}};
    // Floorplan demo: rotate which rooms are lit / motion / temp
    const roomCycle = [
      ["living","kitchen"], ["kitchen","dining"], ["living"], ["bedroom1","bath2"],
      ["bedroom2"], ["hallway","living"], ["kitchen","dining","living"]
    ];
    const motionCycle = ["living","kitchen","living","bedroom1","bedroom2","hallway","kitchen"];
    const lit = roomCycle[faceIdx % roomCycle.length];
    const motion = motionCycle[faceIdx % motionCycle.length];
    const setLight = (id, on, brightness=180) => {
      state[lightEntity(id)] = { state: on ? "on" : "off", attributes: on ? { brightness } : {} };
    };
    ["bedroom2","kitchen","dining","bath1","living","hallway","bedroom1","bath2","closet_gui","closet_ra"].forEach(r => {
      if (fpUserTouched.has(r)) return;
      setLight(r, lit.includes(r), 120 + ((faceIdx*37)%135));
    });
    ["bedroom2","kitchen","dining","living","hallway","bedroom1","bath2"].forEach(r => {
      state["binary_sensor.motion_"+r] = { state: r === motion ? "on" : "off" };
    });
    state["sensor.temp_living"]    = { state: String(21 + ((faceIdx)%3)) };
    state["sensor.temp_bedroom1"]  = { state: String(20 + ((faceIdx+1)%3)) };
    state["sensor.temp_bedroom2"]  = { state: String(20 + ((faceIdx+2)%3)) };
    state["sensor.humidity_living"]   = { state: String(40 + ((faceIdx*3)%18)) };
    state["sensor.humidity_bedroom1"] = { state: String(42 + ((faceIdx*5)%14)) };
    state["sensor.humidity_bedroom2"] = { state: String(45 + ((faceIdx*7)%12)) };
    state["sensor.humidity_kitchen"]  = { state: String(48 + ((faceIdx*4)%14)) };
    state["sensor.humidity_bath1"]    = { state: String(58 + ((faceIdx*9)%24)) };
    state["sensor.humidity_bath2"]    = { state: String(60 + ((faceIdx*11)%22)) };
    state["sensor.temp_kitchen"]  = { state: String(22 + ((faceIdx)%2)), attributes: { unit_of_measurement: "°C" } };
  }

  if (DEMO) {
    setConn(true);
    let i = 0;
    const faces = ["home","weather","commute","floorplan","grocery","listening","ack"];
    const lockFace = new URLSearchParams(location.search).get("face") || "floorplan";
    const tick = () => {
      seedDemo(i);
      state["input_select.jarvis_card"] = { state: lockFace };
      renderAll();
      i++;
    };
    tick();
    setInterval(tick, 6000);
  } else {
    renderAll();
    showFace("home");
    connect();
  }
})();
</script>
</body>
</html>
